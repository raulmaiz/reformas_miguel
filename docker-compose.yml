services:
  db:
    image: postgres:16-alpine
    container_name: reformas_db
    environment:
      POSTGRES_DB: reformas_miguel
      POSTGRES_USER: reformas_user
      POSTGRES_PASSWORD: reformas_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - reformas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reformas_user -d reformas_miguel"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: reformas_backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/reformas_miguel
      SPRING_DATASOURCE_USERNAME: reformas_user
      SPRING_DATASOURCE_PASSWORD: reformas_pass
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - reformas_network

  frontend:
    build: ./frontend
    container_name: reformas_frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - reformas_network

volumes:
  postgres_data:

networks:
  reformas_network:
    driver: bridge
