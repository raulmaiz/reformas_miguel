spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reformas_miguel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:reformas_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:reformas_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=${PORT:8080}
